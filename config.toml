# ---------------------------------------------------------------------------
#  HOW TO ADD AN APP  ->  see ADD.md
#
#  Turn an app on : find its block below and set  enabled = true
#  Add a new app  : copy this block to the end of the file
#
#      [My-App]
#      enabled = true
#      apkmirror-dlurl = "https://www.apkmirror.com/apk/<vendor>/<app>"
#
#      gplay-dlurl = "https://play.google.com/store/apps/details?id=<package>"   # optional 2nd source
#
#      [My-App.patches]
#      "github:<owner>/<patches-repo>" = []     # [] = the bundle's DEFAULT (recommended)
#                                               # patches, not every patch in it
#
#  Which apps a patch source covers, and the exact patch names, are listed in
#  the generated catalog:  https://qutaiba-khader.github.io/morphe-builder/
#
#  Full option reference: CONTRIBUTING.md
# ---------------------------------------------------------------------------

strict-sigcheck = false

[YouTube]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
gplay-dlurl = "https://play.google.com/store/apps/details?id=com.google.android.youtube"

[YouTube.patches]
# no include list = the bundle's own default (recommended) patches.
# exclude = the universal patches, which we do not want applied.
"github:MorpheApp/morphe-patches" = { exclude = [
  "Change installer source",
  "Clone app",
  "Disable Play Store updates",
  "Override certificate pinning",
] }

[YT-Music]
enabled = false
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "both"

[YT-Music.patches]
"github:MorpheApp/morphe-patches" = []

[Reddit]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
gplay-dlurl = "https://play.google.com/store/apps/details?id=com.reddit.frontpage"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = { exclude = [
  "Change installer source",
  "Clone app",
  "Disable Play Store updates",
  "Override certificate pinning",
] }

# Pre-release twin of [YouTube]: the same recommended patches, but built from the
# patch source's newest DEV bundle, under its own brand so it releases and updates
# separately, with its own name, icon AND package - so it installs next to the
# stable YouTube instead of replacing it.
#
# How the package is set: `GmsCore support` asks `Clone app` for the name
# (setOrGetFallbackPackageName) and only falls back to app.morphe.android.youtube
# when Clone app's `packageName` is still "Default". So the name goes on Clone app.
# 🔴 A `-O` option binds to the `-e` it FOLLOWS: keep `-OpackageName` directly after
# `-e 'Clone app'`, or it lands on the next patch and is silently ignored (that is
# exactly what happened on 2026-09-20, when it followed the excludes instead).
[YouTube-Experimental]
enabled = true
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
gplay-dlurl = "https://play.google.com/store/apps/details?id=com.google.android.youtube"
version = "exp"
patcher-args = "-e 'Clone app' -OpackageName=app.morphe.android.youtube.dev -e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName='YouTube Morphe Dev'"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev", exclude = [
  "Change installer source",
  "Disable Play Store updates",
  "Override certificate pinning",
] }

[YT-Music-Experimental]
enabled = false
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "both"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomIcon=icons/Music/branding -OcustomName='Music Morphe'"

[YT-Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

# Pre-release twin of [Reddit] — see the note on [YouTube-Experimental].
[Reddit-Experimental]
enabled = true
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
gplay-dlurl = "https://play.google.com/store/apps/details?id=com.reddit.frontpage"
version = "exp"
# Clone app is enabled here in patcher-args, not in the patches `include` list:
# upstream picks the stock version from the included patches' compatible
# versions, and Clone app, being universal, has none of its own.
patcher-args = "-e 'Clone app' -e 'Custom branding name for Reddit' -OappName='Reddit Morphe Dev'"

[Reddit-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev", exclude = [
  "Change installer source",
  "Disable Play Store updates",
  "Override certificate pinning",
] }


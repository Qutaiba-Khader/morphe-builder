# Stremio for Android TV with the SubSense subtitle auto-refresh patch (Qutaiba-Khader/stremio-subs-patches).
# The APK comes straight from Stremio (its download feed, see src/scrapers/stremio.py), always the newest version:
# CI rebuilds it when the patches publish a release AND when Stremio publishes a new Android TV version.
# Two APKs per release, both from the same Stremio APK and the same patch bundle:
#   [Stremio-TV]         "Stremio TV Clone" - installs BESIDE the original Stremio (Clone app -> com.stremio.one.subs,
#                        named "Stremio Subs" on the launcher). The table keeps its name so its Obtainium page stays.
#   [Stremio-TV-Replace] "Stremio TV Replacement" - REPLACES the original: same package com.stremio.one, same name
#                        "Stremio". It is signed with this builder's key, not Stremio's, so the original must be
#                        uninstalled once before the first install.
# 🔴 `-OpackageName` must directly follow `-e 'Clone app'`: patcher-args go after the includes, and "Clone app" is the
# last include because morphe-patches is the last patch source below.
# armeabi-v7a: the owner's Google TV Streamer is 32-bit only (abilist armeabi-v7a,armeabi); the 32-bit APK also runs on
# 64-bit devices, so one ABI serves every device.
# 🔴 The two app-names must stay different and neither may be plain "Stremio TV": an asset is matched to its app by
# "<app-name>-<brand>-v", and the first release's clone assets are named stremio-tv-subs-v….
# 🔴 Pinned to Android TV 1.11.3 (2026-10-27): 1.12.0 minifies Media3 (Player, MediaItem, Cue renamed; PlayerView gone),
# so the subs patches 0.5.0 fail on it (PlayerView.setPlayer not found). Unpin when the patches support 1.12.0.
[Stremio-TV]
enabled = true
app-name = "Stremio TV Clone"
brand = "subs"
stremio-dlurl = "https://api.strem.io/downloads/config#android_tv@1.11.3:40000003"
arch = "armeabi-v7a"
version = "latest"
exclusive-patches = true
patcher-args = "-OpackageName=com.stremio.one.subs"

[Stremio-TV.patches]
"github:Qutaiba-Khader/stremio-subs-patches" = ["Subtitle auto-refresh", "Right-to-left subtitle lines", "Test app name"]
"github:MorpheApp/morphe-patches" = ["Clone app"]

[Stremio-TV-Replace]
enabled = true
app-name = "Stremio TV Replacement"
brand = "subs"
stremio-dlurl = "https://api.strem.io/downloads/config#android_tv@1.11.3:40000003"
arch = "armeabi-v7a"
version = "latest"
exclusive-patches = true

[Stremio-TV-Replace.patches]
"github:Qutaiba-Khader/stremio-subs-patches" = ["Subtitle auto-refresh", "Right-to-left subtitle lines"]

# Stremio for Android PHONES (a separate app: 2.x, feed entry "android"), same patches, installed BESIDE the original
# phone app only: Clone app -> com.stremio.one.subs.phone (its own package, so it never collides with the TV clone),
# named "Stremio Subs". arm64-v8a: the phone APKs are per CPU and current phones are 64-bit. The patches work in the
# app's ExoPlayer player (its default), not with mpv or VLC.
[Stremio-Phone]
enabled = true
app-name = "Stremio Phone Clone"
brand = "subs"
stremio-dlurl = "https://api.strem.io/downloads/config#android"
arch = "arm64-v8a"
version = "latest"
exclusive-patches = true
patcher-args = "-OpackageName=com.stremio.one.subs.phone"

[Stremio-Phone.patches]
"github:Qutaiba-Khader/stremio-subs-patches" = ["Subtitle auto-refresh", "Right-to-left subtitle lines", "Test app name"]
"github:MorpheApp/morphe-patches" = ["Clone app"]

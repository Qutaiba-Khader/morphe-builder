<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Morphe Builder</title>
  <desc id="d">Patched YouTube and Reddit APKs, rebuilt and signed automatically on GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="84" fill="#a5b4fc" font-size="17" font-weight="600" letter-spacing="3">AUTOMATIC ANDROID BUILDS</text>
    <text x="62" y="152" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1">Morphe Builder</text>
    <text x="64" y="196" fill="#cbd5e1" font-size="24">Patched YouTube and Reddit, rebuilt and signed for you.</text>

    <g font-size="17" font-weight="600" fill="#e0e7ff">
      <rect x="64" y="226" width="152" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <circle cx="86" cy="245" r="5" fill="#4ade80"/>
      <text x="100" y="251">Daily builds</text>

      <rect x="228" y="226" width="222" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <circle cx="250" cy="245" r="5" fill="#c4b5fd"/>
      <text x="264" y="251">Stable + pre-release</text>

      <rect x="462" y="226" width="196" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <circle cx="484" cy="245" r="5" fill="#60a5fa"/>
      <text x="498" y="251">Obtainium ready</text>
    </g>
  </g>

  <!-- three app tiles: video, community, pre-release -->
  <g filter="url(#shadow)">
    <g transform="translate(1010 58) rotate(10)">
      <rect width="118" height="118" rx="30" fill="url(#violet)"/>
      <text x="59" y="72" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800">DEV</text>
    </g>
    <g transform="translate(900 120) rotate(-6)">
      <rect width="130" height="130" rx="34" fill="url(#orange)"/>
      <path d="M36 44h58a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12H60l-16 14v-14h-8a12 12 0 0 1-12-12V56a12 12 0 0 1 12-12z" fill="#ffffff"/>
    </g>
    <g transform="translate(792 52) rotate(-14)">
      <rect width="142" height="142" rx="36" fill="url(#red)"/>
      <path d="M56 42l50 29-50 29z" fill="#ffffff"/>
    </g>
  </g>
</svg>

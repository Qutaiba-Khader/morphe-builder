name: Catalog

# Rebuilds data/catalog.json: every patch source in config.toml, the apps it can
# patch, the exact patch names and the versions each supports.
# Run this after adding a new patch source so the site can show it.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_catalog.py

      - name: Commit if changed
        run: |
          # "generated" changes on every run; only a change in the data counts
          strip() { python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d.pop("generated",None); print(json.dumps(d,sort_keys=True))' "$1"; }
          if git cat-file -e HEAD:data/catalog.json 2>/dev/null; then
            git show HEAD:data/catalog.json > /tmp/old-catalog.json
            if [ "$(strip /tmp/old-catalog.json)" = "$(strip data/catalog.json)" ]; then
              echo "catalog unchanged"
              exit 0
            fi
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore(catalog): refresh patch source catalog"
          # main may have moved during the generation (a README bot commit, a push)
          git pull --rebase origin main
          git push

  site:
    needs: catalog
    permissions:
      contents: write   # the called workflow pushes gh-pages and commits README.md
      actions: read     # the called workflow checks whether a build is running
    uses: ./.github/workflows/site.yml

name: Catalog

# Rebuilds data/catalog.json: every patch source in config.toml, the apps it can
# patch, the exact patch names and the versions each supports.
# Run this after adding a new patch source so the site can show it.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_catalog.py

      - name: Commit if changed
        run: |
          git add data/catalog.json
          # --cached, so a catalog.json that does not exist upstream yet still counts
          if git diff --cached --quiet -- data/catalog.json; then
            echo "catalog unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): refresh patch source catalog"
          git push

  site:
    needs: catalog
    permissions:
      contents: write   # the called workflow's readme job commits README.md
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

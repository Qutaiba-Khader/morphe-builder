name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Select patch source'
        required: true
        default: 'morphe'
        type: choice
        options:
          - morphe
          - morphe-dev
          - piko
          - rushi
          - hoo-dles
          - hooman
          - paresh
          - de-vanced
          - tiktok
          - subs
          - metra
      apps:
        description: 'Only these config.toml tables, comma-separated (empty = every app of the source)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      patch_source:
        default: 'morphe'
        type: string
      apps:
        default: ''
        type: string
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

# Two builds of one patch source at once would write into the same release.
concurrency:
  group: build-${{ inputs.patch_source }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare version and draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(date +%y.%m.%d)-${{ inputs.patch_source }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Today's release stays published: drafting it would break every download link
            # for the whole build, and for good if the run were cancelled or failed.
            echo "Today's release exists; this build adds to it"
          else
            gh release create "$VER" --draft --title "$VER" --notes "" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set matrix based on patch source
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          ONLY_APPS: ${{ inputs.apps }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          # Google Play, the second APK source (src/scrapers/gplay.py): Aurora's anonymous
          # sign-in refuses GitHub's runners (HTTP 403), so it needs a Google account here.
          # Both unset = Google Play is skipped. Use a throwaway account (ADD.md).
          GOOPDL_ACCOUNT_EMAIL: ${{ secrets.GOOPDL_ACCOUNT_EMAIL }}
          GOOPDL_AAS_TOKEN: ${{ secrets.GOOPDL_AAS_TOKEN }}
        run: uv run main.py ${{ matrix.id }} ${{ matrix.arch }}

      # Nothing unusable gets as far as a release: wrong key, wrong version inside, wrong
      # CPU, or a patch that left nothing in the app. A rejected APK is deleted here.
      - name: Verify APKs
        if: always()
        env:
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk)
          [[ ${#apks[@]} -eq 0 ]] || python3 tools/verify_apk.py "${apks[@]}"

      - name: Upload APKs to release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk)
          if [[ ${#apks[@]} -gt 0 && ! -f ./build/.verified ]]; then
            echo "::error title=APK rejected::the check did not finish, so nothing is uploaded"
            exit 1
          fi
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi
          gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload build log to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.md ]] || exit 0
          [[ -s build.md ]] || exit 0
          cp build.md "build-${LABEL}.md"
          gh release upload "$TAG" "build-${LABEL}.md" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Download logs from draft release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p logs
          # No log = every build of this run failed, and the APKs here are from an earlier one.
          # A log that exists must download: a failure here must not pass for "no logs".
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(startswith("build-"))] | length')
          if [ "$count" -gt 0 ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "build-*.md" --dir logs
          else
            echo "::warning::no build logs in $TAG"
          fi

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -o pipefail
          uv run python -m src.scripts.logs combine-logs logs | sed "s/{TAG}/$TAG/g" > final.md
          [ -s final.md ] && python3 tools/prune_release.py --merge-notes "$TAG" final.md
          notes=(); [ -s final.md ] && notes=(--notes-file final.md)  # no new logs: keep the notes that describe the APKs
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "$TAG" "${notes[@]}"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "$TAG" "${notes[@]}"
          fi
          # Only now: until the release is finalized the logs are what a re-run needs.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | startswith("build-")) | .apiUrl' | xargs -I{} gh api --method DELETE "{}"

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify '${{ inputs.patch_source }}'

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
name: CI
on:
  schedule:
    # GitHub starts scheduled runs hours late (10:00 UTC ran as late as 20:08), so check
    # more than once a day. A check that finds nothing new costs half a minute.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Get build matrix
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Not `echo "x=$(...)"`: echo's success would hide a crash, and a crashed check
          # looks exactly like "nothing new" on a green run.
          if [ "${{ inputs.force_build }}" = "true" ]; then
            matrix="$(uv run python -m src.scripts.matrix get-matrix-force)"
          else
            matrix="$(uv run python -m src.scripts.matrix get-matrix)"
          fi
          jq -e 'type == "array"' <<<"$matrix" >/dev/null
          echo "build_matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"

      - name: Notify skipped build
        if: steps.get-matrix.outputs.build_matrix == '[]'
        run: echo "::notice title=Build Skipped::No new releases detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+301 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  build:
    needs: check-versions
    if: needs.check-versions.outputs.build_matrix != '[]' && needs.check-versions.outputs.build_matrix != ''
    strategy:
      fail-fast: false
      matrix:
        patch_source: ${{ fromJSON(needs.check-versions.outputs.build_matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      patch_source: ${{ matrix.patch_source }}
      filter_changelog: ${{ inputs.force_build != true }}
    secrets: inherit
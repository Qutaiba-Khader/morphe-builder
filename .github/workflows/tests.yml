name: Tests

# The release flow's deterministic tests and its coverage gate (docs/FLOW-MAP.md).
# A red run here also raises an alert through the Health workflow.
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - 'tests/**'
      - 'config.toml'
      - 'flowmap.json'
      - 'docs/flow-map/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install coverage

      - name: Coverage gate and tests
        env:
          FLOWMAP_PYTHON: .venv/bin/python
          GITHUB_TOKEN: test
        run: python3 tools/flow/flowmap.py check

      - name: The gate tests can fail
        env:
          FLOWMAP_PYTHON: .venv/bin/python
          GITHUB_TOKEN: test
        run: python3 tools/flow/flowmap.py mutate

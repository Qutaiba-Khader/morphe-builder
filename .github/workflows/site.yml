name: Site

# Rebuilds the Pages site and its JSON API from this repo's releases.
# Runs after every CI run, on a schedule as a safety net, on demand,
# and when called by the Catalog workflow.
on:
  workflow_run:
    # "Build APKs" too: it can be dispatched on its own for a single patch
    # source, and that also produces a release the site must pick up.
    workflows: [CI, Build APKs]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/gen_site.py'
      - 'data/catalog.json'
      - 'config.toml'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always the tip of main: when Catalog calls this workflow it has just
          # pushed a new data/catalog.json, and the calling run's own ref still
          # points at the commit before it.
          ref: main

      - name: Generate site and API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Keep the README's app table (one row + Obtainium badge per app, per channel)
  # in step with what was just published. README.md is not in this workflow's
  # push paths, so this commit cannot re-trigger it.
  readme:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Regenerate the app table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/gen_site.py > /dev/null
          python3 tools/gen_readme.py

      - name: Commit if changed
        run: |
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): refresh the app table"
          git pull --rebase origin main
          git push

name: Site

# Rebuilds the Pages site and its JSON API from this repo's releases.
# Runs after every CI run, on a schedule as a safety net, on demand,
# and when called by the Catalog workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always the tip of main: when Catalog calls this workflow it has just
          # pushed a new data/catalog.json, and the calling run's own ref still
          # points at the commit before it.
          ref: main

      - name: Generate site and API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

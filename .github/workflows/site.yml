name: Site

# Rebuilds the Pages site and its JSON API from this repo's releases.
# Runs after every CI run, on a schedule as a safety net, on demand,
# and when called by the Catalog workflow.
on:
  workflow_run:
    # "Build APKs" too: it can be dispatched on its own for a single patch
    # source, and that also produces a release the site must pick up.
    workflows: [CI, Build APKs]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'data/catalog.json'
      - 'config.toml'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write   # publishes _site to the gh-pages branch; the readme job commits README.md
  actions: read     # gen_site.py checks whether a build is running (releases are drafts then)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gen.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always the tip of main: when Catalog calls this workflow it has just
          # pushed a new data/catalog.json, and the calling run's own ref still
          # points at the commit before it.
          ref: main

      # While CI or Build APKs is running, its release is a draft and what is
      # visible is a mix of old and new builds. gen_site.py then sets skip=true
      # and exits 0: nothing is published, the live site stays as it is, and the
      # build's own completion triggers this workflow again.
      # Started by a build that just finished: let the API's 60 s cache of the
      # release list expire as well, so the new release is certainly visible.
      - name: Let the release settle
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Generate site and API
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_site.py

      # Published by pushing to the gh-pages branch, which Pages serves. Not
      # actions/deploy-pages: its deployment id is the commit SHA, and Pages keeps
      # serving the FIRST artifact deployed for a SHA while reporting success
      # (actions/deploy-pages#383) - so a new release, which brings no new commit,
      # never reached the live site. Every push here is a new commit, so it does.
      - name: Publish to gh-pages
        if: steps.gen.outputs.skip != 'true'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/gh-pages"
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git worktree add -B gh-pages "$out" FETCH_HEAD
          else
            git worktree add --detach "$out"
            git -C "$out" checkout --orphan gh-pages
            git -C "$out" rm -rfq .
          fi
          rsync -a --delete --exclude .git _site/ "$out/"
          cd "$out"
          git add -A
          # "generated" timestamps change on every run; only real content counts
          if git diff --cached --quiet -I '"generated": ' ; then
            echo "site unchanged"
            exit 0
          fi
          git commit -qm "site: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push origin gh-pages

  # Keep the README's app table (one row + Obtainium badge per app, per channel)
  # in step with what was just published. README.md is not in this workflow's
  # push paths, so this commit cannot re-trigger it.
  readme:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Regenerate the app table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/gen_site.py > gen.log
          if grep -q '^skip: ' gen.log; then
            # a build started after the deploy - its own Site run will do this
            cat gen.log; exit 0
          fi
          python3 tools/gen_readme.py

      - name: Commit if changed
        run: |
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): refresh the app table"
          git pull --rebase origin main
          git push
